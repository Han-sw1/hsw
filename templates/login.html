<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - ATEC 단말기 장애 자동화</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #C8175C;
      --primary-dark: #9E1148;
      --primary-light: #FCEEF5;
      --gray-dark: #4A4B52;
      --gray: #8C8E95;
      --gray-light: #F4F5F8;
      --border: #E2E3EA;
      --white: #FFFFFF;
      --green: #1E7A3C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #ECEDF2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 24px 16px;
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-img { height: 48px; width: auto; max-width: 100%; }
    .logo-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--gray-dark);
      letter-spacing: 0.5px;
      text-align: center;
    }
    .login-card {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 32px 28px 28px;
    }
    .login-card h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--gray-dark);
      margin-bottom: 24px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-dark);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: var(--gray);
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0 12px 0 36px;
      font-size: 14px;
      font-family: inherit;
      color: var(--gray-dark);
      background: var(--gray-light);
      transition: border 0.2s, background 0.2s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: var(--primary);
      background: var(--white);
    }
    .input-wrap .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--gray);
      padding: 4px;
      line-height: 1;
    }
    .input-wrap .toggle-pw:hover { color: var(--primary); }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .remember-row label {
      font-size: 13px;
      color: var(--gray);
      cursor: pointer;
      user-select: none;
    }
    .btn-login {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-login:hover { background: var(--primary-dark); }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 11px;
      color: var(--gray);
    }
    .signup-link {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }
    .signup-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    .signup-link a:hover { text-decoration: underline; }
    .alert {
      background: #FCEEF5;
      border: 1.5px solid #f0b8d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 16px;
      text-align: center;
    }
    .alert.success {
      background: #EBF7EE;
      border-color: #a8d5b5;
      color: #1E7A3C;
    }
    .alert.pending {
      background: #FFF8E1;
      border-color: #FFD54F;
      color: #7B5800;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-area">
      <img src="/static/logo.png" alt="ATEC" class="logo-img">
      <div class="logo-title">단말기 장애 자동화 시스템</div>
    </div>

    <div class="login-card">
      <h2>로그인</h2>

      {% if signup_msg %}
      <div class="alert success">{{ signup_msg }}</div>
      {% endif %}
      {% if pending_msg %}
      <div class="alert pending">{{ pending_msg }}</div>
      {% endif %}
      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" id="loginForm">
        <div class="form-group">
          <label for="username">아이디</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" placeholder="아이디 입력" autocomplete="username" value="{{ saved_id or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" autocomplete="current-password">
            <button type="button" class="toggle-pw" id="togglePw" tabindex="-1">👁</button>
          </div>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="rememberMe" name="remember_me">
          <label for="rememberMe">아이디 저장</label>
        </div>

        <button type="submit" class="btn-login">로그인</button>
      </form>

      <div class="divider"><span>또는</span></div>

      <div class="signup-link">
        계정이 없으신가요? <a href="/signup">회원가입</a>
      </div>
    </div>
  </div>

  <script>
    // 아이디 저장 (localStorage)
    const usernameInput = document.getElementById('username');
    const rememberCheck = document.getElementById('rememberMe');

    const savedId = localStorage.getItem('atmo_saved_id');
    if (savedId) {
      usernameInput.value = savedId;
      rememberCheck.checked = true;
    }

    document.getElementById('loginForm').addEventListener('submit', function() {
      if (rememberCheck.checked) {
        localStorage.setItem('atmo_saved_id', usernameInput.value.trim());
      } else {
        localStorage.removeItem('atmo_saved_id');
      }
    });

    // 비밀번호 보이기/숨기기
    document.getElementById('togglePw').addEventListener('click', function() {
      const pw = document.getElementById('password');
      if (pw.type === 'password') {
        pw.type = 'text';
        this.textContent = '🙈';
      } else {
        pw.type = 'password';
        this.textContent = '👁';
      }
    });
  </script>
</body>
</html>
