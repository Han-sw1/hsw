<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATEC 전체 접수 현황</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=20260313">
  <style>
    .rd-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:6px; min-width:0; }
    .rd-grid > * { min-width:0; overflow:hidden; }
    @media(max-width:1100px){.rd-grid{grid-template-columns:1fr;}}
    .chart-box { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; }
    .full-width { grid-column:1/-1; }
    .chart-title { font-size:15px; font-weight:700; color:var(--gray-dark); margin-bottom:16px; }
    .tab-group { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .tab-btn {
      padding:6px 16px; border-radius:6px; border:1.5px solid var(--border);
      font-size:13px; font-weight:600; cursor:pointer; background:var(--white);
      color:var(--gray-dark); font-family:inherit; transition:all 0.15s;
    }
    .tab-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }
    .tab-btn.b-tab.active  { background:#C8175C; border-color:#C8175C; }
    .tab-btn.rg-tab.active { background:var(--green); border-color:var(--green); }
    .tab-btn.ap-tab.active { background:var(--blue); border-color:var(--blue); }
    .view-toggle { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
    .view-btn {
      padding:5px 14px; border-radius:5px; border:1.5px solid var(--border);
      font-size:12px; font-weight:600; cursor:pointer; background:var(--white);
      color:var(--gray-dark); font-family:inherit; transition:all 0.15s;
    }
    .view-btn.active { background:var(--brand-gray); border-color:var(--brand-gray); color:#fff; }
    .rd-table { width:100%; border-collapse:collapse; font-size:13px; }
    .rd-table th {
      background:var(--brand-gray); color:#fff; padding:10px 12px;
      text-align:center; font-weight:700; white-space:nowrap; font-size:12px; position:sticky; top:0;
    }
    .rd-table td { padding:9px 12px; border-bottom:1px solid var(--border); text-align:center; }
    .rd-table td:first-child { text-align:left; font-weight:600; color:var(--gray-dark); max-width:220px; word-break:keep-all; }
    .rd-table tr:last-child td { border-bottom:none; font-weight:800; background:var(--gray-light); }
    .rd-table tr:hover:not(:last-child) td { background:#FAFBFF; }
    .rd-table .total-col { font-weight:800; font-size:14px; color:var(--primary); }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; margin-bottom:18px; }
    .summary-card {
      background:var(--gray-light); border-radius:8px; padding:12px 14px;
      text-align:center;
    }
    .summary-card .s-name { font-size:12px; font-weight:700; color:var(--gray-dark); margin-bottom:4px; }
    .summary-card .s-total { font-size:22px; font-weight:800; color:var(--primary); }
    .summary-card .s-sub { font-size:11px; color:var(--gray); margin-top:2px; }
    .month-sel { padding:7px 12px; border:1.5px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:var(--white); cursor:pointer; }
    .month-sel:focus { outline:none; border-color:var(--primary); }
    .section-label { font-size:12px; font-weight:700; color:var(--gray); margin-right:6px; }
    .table-wrap { overflow:auto; max-height:500px; }
    .loading-bar { text-align:center; padding:60px; color:var(--gray); font-size:14px; }
    .nav-back {
      display:inline-flex; align-items:center; gap:6px;
      font-size:13px; color:var(--gray); text-decoration:none;
      padding:7px 14px; border-radius:6px; border:1.5px solid var(--border);
      background:var(--white); font-weight:600; transition:all 0.15s;
    }
    .nav-back:hover { border-color:var(--primary); color:var(--primary); }
    .empty-msg { color:var(--gray); font-size:13px; padding:20px 0; text-align:center; }
    .filter-wrap { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="sidebar-toggle-btn" id="sidebarToggle" title="메뉴 열고 닫기">
          <svg viewBox="0 0 20 20"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
        </button>
        <a class="logo-area" href="/">
          <img src="/static/logo.png" alt="ATEC 에이텍모빌리티" class="logo-img">
        </a>
      </div>
      <div class="header-title">전체 접수 현황</div>
      <div class="header-right">
        <div id="lastUpdateBadge" class="last-update-badge" style="display:none;" title="마지막 업데이트"></div>
        <button class="theme-toggle" id="themeToggle" title="다크모드 전환">☀️</button>
        <div class="header-divider"></div>
        <div class="header-user">
          <span class="header-user-name">{{ current_user.name }}</span>
          {% if current_user.is_admin %}<span class="header-user-badge">관리자</span>{% endif %}
        </div>
      </div>
    </div>
  </header>
  <div class="page-body">
  {% include '_sidebar.html' %}
  <div class="page-content">
  <main class="main">
    <div id="loadingBar" class="loading-bar">데이터를 불러오는 중입니다...</div>
    <div id="pageContent" style="display:none">

      <!-- ── B800 / B700 / B710 ── -->
      <div class="rd-grid">
        <div class="chart-box full-width" id="bSeriesSection">
          <div class="chart-title">&#128241; B800 / B700 / B710 전체 접수 현황</div>
          <div class="summary-grid" id="bSummary"></div>
          <div class="filter-wrap">
            <div class="tab-group" id="bTabGroup"></div>
            <div class="view-toggle" id="bViewToggle"></div>
          </div>
          <div class="table-wrap">
            <table class="rd-table" id="bTable"></table>
          </div>
        </div>

        <!-- ── 공항 B620 ── -->
        <div class="chart-box full-width" id="b620Section">
          <div class="chart-title">&#9992; 공항 B620 전체 접수 현황</div>
          <div class="summary-grid" id="b620Summary"></div>
          <div class="view-toggle" id="b620ViewToggle"></div>
          <div class="table-wrap">
            <table class="rd-table" id="b620Table"></table>
          </div>
        </div>

        <!-- ── 지역버스 ── -->
        <div class="chart-box full-width" id="regionalSection">
          <div class="chart-title">&#128652; 지역버스 전체 접수 현황</div>
          <div class="summary-grid" id="rgSummary"></div>
          <div class="filter-wrap">
            <div class="tab-group" id="rgTabGroup"></div>
            <div class="view-toggle" id="rgViewToggle"></div>
          </div>
          <div class="table-wrap">
            <table class="rd-table" id="rgTable"></table>
          </div>
        </div>
      </div>

    </div>
  </main>

  </div>{# page-content #}
  </div>{# page-body #}
  <script src="/static/js/rawdata.js?v=20260310a"></script>
  <script src="/static/js/theme.js"></script>
</body>
</html>
