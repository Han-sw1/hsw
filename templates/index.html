<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATEC 단말기 장애 자동화</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo-area" href="/">
        <div class="logo-mark">
          <span class="logo-a">A</span><span class="logo-tec">TEC</span>
        </div>
        <div class="logo-divider"></div>
        <span class="logo-korean">에이텍모빌리티</span>
      </a>
      <h1 class="header-title">단말기 장애 자동화 시스템</h1>
      <button class="btn-icon" id="btnSettings" title="기준파일 경로 설정">⚙</button>
    </div>
  </header>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>기준 파일 경로 설정</h2>
        <button class="btn-close" id="closeSettings">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>오류처리유형 기준 파일 (.xlsx)</label>
          <input type="text" id="criteriaPath" placeholder="예: C:\Users\...\★오류처리유형 기준_....xlsx">
        </div>
        <div class="form-group">
          <label>CITS 단말기 차량정보 파일 (.xlsx)</label>
          <input type="text" id="citsPath" placeholder="예: C:\Users\...\CITS 단말기 1600대 차량정보_....xlsx">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveSettings">저장</button>
        <button class="btn btn-secondary" id="cancelSettings">취소</button>
      </div>
    </div>
  </div>

  <main class="main">
    <!-- 업로드 영역 -->
    <section class="card upload-card">
      <div class="card-header">
        <span class="card-icon">📂</span>
        <h2>원본 파일 업로드 <span class="sub-title">(여러 파일 동시 업로드 가능)</span></h2>
      </div>
      <div class="card-body">
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">📋</div>
          <p class="drop-text">파일을 여기에 끌어다 놓거나 클릭하여 선택하세요<br>
          <span class="drop-hint">서울원본 · B710원본 · 공항원본 · 지역버스 — 한 번에 모두 업로드 가능</span></p>
          <input type="file" id="fileInput" accept=".xls,.xlsx" multiple hidden>
          <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">파일 선택</button>
        </div>
        <div id="fileList" class="file-list"></div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary btn-lg" id="btnProcess" disabled>
          ⚡ 장애 데이터 처리
        </button>
      </div>
    </section>

    <!-- 처리 결과 요약 -->
    <section class="card" id="resultCard" style="display:none">
      <div class="card-header">
        <span class="card-icon">📊</span>
        <h2>처리 결과</h2>
        <button class="btn btn-primary btn-sm" id="btnDownload">⬇ 엑셀 다운로드</button>
      </div>
      <div class="card-body">
        <div class="summary-grid" id="summaryGrid"></div>
      </div>
    </section>

    <!-- 미리보기 -->
    <section class="card" id="previewCard" style="display:none">
      <div class="card-header">
        <span class="card-icon">🔍</span>
        <h2>데이터 미리보기</h2>
        <div class="tab-buttons" id="tabButtons"></div>
      </div>
      <div class="card-body table-wrapper">
        <table class="data-table" id="previewTable">
          <thead id="previewHead"></thead>
          <tbody id="previewBody"></tbody>
        </table>
        <div class="empty-notice" id="emptyNotice" style="display:none">이 탭에는 장애 데이터가 없습니다.</div>
      </div>
    </section>

    <!-- 로딩 -->
    <div class="loading-overlay" id="loadingOverlay" style="display:none">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>처리 중입니다...</p>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
