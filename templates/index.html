<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATEC 단말기 장애 자동화</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo-area">
        <span class="logo-a">A</span><span class="logo-tec">TEC</span>
        <span class="logo-sub">에이텍모빌리티</span>
      </div>
      <h1 class="header-title">단말기 장애 자동화 시스템</h1>
      <button class="btn-icon" id="btnSettings" title="설정">⚙</button>
    </div>
  </header>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>기준 파일 경로 설정</h2>
        <button class="btn-close" id="closeSettings">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>오류처리유형 기준 파일 (.xlsx)</label>
          <input type="text" id="criteriaPath" placeholder="예: C:\Users\user\OneDrive\바탕 화면\260222\★오류처리유형 기준_260203_수정_B800구분추가.xlsx">
        </div>
        <div class="form-group">
          <label>CITS 단말기 차량정보 파일 (.xlsx)</label>
          <input type="text" id="citsPath" placeholder="예: C:\Users\user\OneDrive\바탕 화면\260222\CITS 단말기 1600대 차량정보_210810(간편정리).xlsx">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveSettings">저장</button>
        <button class="btn btn-secondary" id="cancelSettings">취소</button>
      </div>
    </div>
  </div>

  <main class="main">
    <!-- 업로드 영역 -->
    <section class="card upload-card">
      <div class="card-header">
        <span class="card-icon">📂</span>
        <h2>원본 장애 파일 업로드</h2>
      </div>
      <div class="card-body">
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">📋</div>
          <p class="drop-text">단말기장애목록 .xls 파일을 여기에 끌어다 놓거나<br>클릭하여 선택하세요</p>
          <input type="file" id="fileInput" accept=".xls,.xlsx" hidden>
          <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">파일 선택</button>
        </div>
        <div class="selected-file" id="selectedFile" style="display:none">
          <span class="file-icon">📄</span>
          <span id="fileName"></span>
          <button class="btn-remove" id="removeFile">✕</button>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary btn-lg" id="btnProcess" disabled>
          <span class="btn-icon-text">⚡</span> 장애 데이터 처리
        </button>
      </div>
    </section>

    <!-- 처리 결과 요약 -->
    <section class="card result-summary" id="resultSummary" style="display:none">
      <div class="card-header">
        <span class="card-icon">📊</span>
        <h2>처리 결과</h2>
        <button class="btn btn-primary btn-sm" id="btnDownload">⬇ 엑셀 다운로드</button>
      </div>
      <div class="card-body">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">원본 전체</div>
            <div class="stat-value" id="statTotal">-</div>
          </div>
          <div class="stat-arrow">→</div>
          <div class="stat-card">
            <div class="stat-label">B700/B800 필터</div>
            <div class="stat-value accent" id="statB700B800">-</div>
          </div>
          <div class="stat-arrow">→</div>
          <div class="stat-card">
            <div class="stat-label">증상재현 필터</div>
            <div class="stat-value accent" id="statReplay">-</div>
          </div>
          <div class="stat-arrow">→</div>
          <div class="stat-card highlight">
            <div class="stat-label">최종 장애 건수</div>
            <div class="stat-value red" id="statFinal">-</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 미리보기 테이블 -->
    <section class="card" id="previewCard" style="display:none">
      <div class="card-header">
        <span class="card-icon">🔍</span>
        <h2>데이터 미리보기</h2>
        <span class="preview-note">(최대 50행)</span>
      </div>
      <div class="card-body table-wrapper">
        <table class="data-table" id="previewTable">
          <thead id="previewHead"></thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 로딩 -->
    <div class="loading-overlay" id="loadingOverlay" style="display:none">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>처리 중입니다...</p>
      </div>
    </div>

    <!-- 토스트 메시지 -->
    <div class="toast" id="toast"></div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
