<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - ATEC 단말기 장애 자동화</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #C8175C;
      --primary-dark: #9E1148;
      --primary-light: #FCEEF5;
      --gray-dark: #4A4B52;
      --gray: #8C8E95;
      --gray-light: #F4F5F8;
      --border: #E2E3EA;
      --white: #FFFFFF;
      --green: #1E7A3C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #ECEDF2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .signup-wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-img { height: 48px; width: auto; max-width: 100%; }
    .logo-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--gray-dark);
      letter-spacing: 0.5px;
      text-align: center;
    }
    .signup-card {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 32px 28px 28px;
    }
    .signup-card h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--gray-dark);
      margin-bottom: 24px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-dark);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: var(--gray);
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0 12px 0 36px;
      font-size: 14px;
      font-family: inherit;
      color: var(--gray-dark);
      background: var(--gray-light);
      transition: border 0.2s, background 0.2s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: var(--primary);
      background: var(--white);
    }
    .input-wrap .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--gray);
      padding: 4px;
      line-height: 1;
    }
    .input-wrap .toggle-pw:hover { color: var(--primary); }
    .input-hint {
      font-size: 11px;
      color: var(--gray);
      margin-top: 4px;
    }
    .username-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .username-row .input-wrap {
      flex: 1;
    }
    .btn-check {
      height: 44px;
      padding: 0 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .btn-check:hover { background: var(--primary-dark); }
    .btn-check:disabled { background: var(--gray); cursor: default; }
    .check-msg {
      font-size: 11px;
      margin-top: 4px;
    }
    .check-msg.ok { color: var(--green); }
    .check-msg.err { color: var(--primary); }
    .btn-signup {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .btn-signup:hover { background: var(--primary-dark); }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span { font-size: 11px; color: var(--gray); }
    .login-link {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }
    .login-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    .login-link a:hover { text-decoration: underline; }
    .alert {
      background: #FCEEF5;
      border: 1.5px solid #f0b8d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 16px;
      text-align: center;
    }
    .alert.success {
      background: #EBF7EE;
      border-color: #a8d5b5;
      color: var(--green);
    }
  </style>
</head>
<body>
  <div class="signup-wrap">
    <div class="logo-area">
      <img src="/static/logo.png" alt="ATEC" class="logo-img">
      <div class="logo-title">단말기 장애 자동화 시스템</div>
    </div>

    <div class="signup-card">
      <h2>회원가입</h2>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}
      {% if success %}
      <div class="alert success">{{ success }}</div>
      {% endif %}

      <form method="POST" action="/signup" id="signupForm">
        <div class="form-group">
          <label for="username">아이디</label>
          <div class="username-row">
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input type="text" id="username" name="username" placeholder="영문/숫자 4~20자" autocomplete="username" maxlength="20">
            </div>
            <button type="button" class="btn-check" id="btnCheckId">중복확인</button>
          </div>
          <div class="check-msg" id="checkMsg"></div>
          <div class="input-hint">영문자, 숫자, 언더스코어(_) 사용 가능 (4~20자)</div>
        </div>

        <div class="form-group">
          <label for="name">이름</label>
          <div class="input-wrap">
            <span class="input-icon">✏️</span>
            <input type="text" id="name" name="name" placeholder="실명 입력" maxlength="20">
          </div>
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="6자 이상" autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw1" tabindex="-1">👁</button>
          </div>
          <div class="input-hint">6자 이상 입력해주세요</div>
        </div>

        <div class="form-group">
          <label for="password2">비밀번호 확인</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password2" name="password2" placeholder="비밀번호 재입력" autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw2" tabindex="-1">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-signup">회원가입</button>
      </form>

      <div class="divider"><span>또는</span></div>

      <div class="login-link">
        이미 계정이 있으신가요? <a href="/login">로그인</a>
      </div>
    </div>
  </div>

  <script>
    function togglePw(inputId, btnId) {
      const pw = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', function() {
        if (pw.type === 'password') {
          pw.type = 'text';
          this.textContent = '🙈';
        } else {
          pw.type = 'password';
          this.textContent = '👁';
        }
      });
    }
    togglePw('password', 'togglePw1');
    togglePw('password2', 'togglePw2');

    // 아이디 중복확인
    let idChecked = false;
    const usernameInput = document.getElementById('username');
    const btnCheck = document.getElementById('btnCheckId');
    const checkMsg = document.getElementById('checkMsg');

    usernameInput.addEventListener('input', function() {
      idChecked = false;
      checkMsg.textContent = '';
      checkMsg.className = 'check-msg';
    });

    btnCheck.addEventListener('click', async function() {
      const val = usernameInput.value.trim();
      if (!val) { checkMsg.textContent = '아이디를 입력해주세요.'; checkMsg.className = 'check-msg err'; return; }
      btnCheck.disabled = true;
      checkMsg.textContent = '확인 중...';
      checkMsg.className = 'check-msg';
      const res = await fetch('/check_username?username=' + encodeURIComponent(val));
      const data = await res.json();
      btnCheck.disabled = false;
      checkMsg.textContent = data.message;
      if (data.available) {
        checkMsg.className = 'check-msg ok';
        idChecked = true;
      } else {
        checkMsg.className = 'check-msg err';
        idChecked = false;
      }
    });

    // 폼 제출 검사
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      if (!idChecked) {
        e.preventDefault();
        checkMsg.textContent = '아이디 중복확인을 해주세요.';
        checkMsg.className = 'check-msg err';
        return;
      }
      const pw1 = document.getElementById('password').value;
      const pw2 = document.getElementById('password2').value;
      if (pw1 !== pw2) {
        e.preventDefault();
        alert('비밀번호가 일치하지 않습니다.');
      }
    });
  </script>
</body>
</html>
